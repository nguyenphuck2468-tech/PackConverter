name: Build Pull Request

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - '.gitignore'
      - 'LICENSE'
      - 'README.md'

permissions:
  contents: read

concurrency:
  group: packconverter-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: '9.5.1'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PackConverter
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: true

      - name: Verify repository hygiene
        run: |
          test ! -e gradle/wrapper/gradle-wrapper.jar
          if git ls-files | grep -E '(^|/)(build|out)/|\.gradle/|gradle/wrapper/gradle-wrapper\.jar$'; then
            echo 'Tracked generated build output or Gradle wrapper binary detected.'
            exit 1
          fi

      - name: Build Thunder
        run: gradle clean build --no-daemon --stacktrace

      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Thunder
          path: bootstrap/build/libs/Thunder.jar
