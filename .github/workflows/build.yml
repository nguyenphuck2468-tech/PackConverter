name: Build

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'
  push:
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/*.yml'
      - '.github/actions/pullrequest.yml'
      - '.idea/copyright/*.xml'
      - '.gitignore'
      - 'LICENSE'
      - 'README.md'

permissions:
  contents: read

concurrency:
  group: packconverter-build-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: '9.5.1'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PackConverter
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Get Release Info
        id: release-info
        uses: GeyserMC/actions/previous-release@master
        with:
          data: ${{ vars.RELEASEACTION_PREVRELEASE }}

      - name: Verify repository hygiene
        run: |
          test ! -e gradle/wrapper/gradle-wrapper.jar
          if git ls-files | grep -E '(^|/)(build|out)/|\.gradle/|gradle/wrapper/gradle-wrapper\.jar$'; then
            echo 'Tracked generated build output or Gradle wrapper binary detected.'
            exit 1
          fi

      - name: Build PackConverter
        run: gradle clean build --no-daemon --stacktrace
        env:
          BUILD_NUMBER: ${{ steps.release-info.outputs.curentRelease }}

      - name: Archive Artifacts
        uses: GeyserMC/actions/upload-multi-artifact@master
        if: success()
        with:
          artifacts: |
            bootstrap/build/libs/Thunder.jar

      - name: Publish to Maven Repository
        if: ${{ success() && github.repository == 'GeyserMC/PackConverter' && github.ref_name == 'master' }}
        run: gradle publish --no-daemon
        env:
          BUILD_NUMBER: ${{ steps.release-info.outputs.curentRelease }}
          ORG_GRADLE_PROJECT_geysermcUsername: ${{ vars.DEPLOY_USER }}
          ORG_GRADLE_PROJECT_geysermcPassword: ${{ secrets.DEPLOY_PASS }}

      - name: Get Version
        if: ${{ (success() || failure()) && github.repository == 'GeyserMC/PackConverter' }}
        id: get-version
        run: |
          version=$(cat gradle.properties | grep -o "version=[0-9\\.]*" | cut -d"=" -f2)
          echo "VERSION=${version}" >> "$GITHUB_OUTPUT"

      - name: Get Release Metadata
        if: ${{ (success() || failure()) && github.repository == 'GeyserMC/PackConverter' }}
        uses: GeyserMC/actions/release@master
        id: metadata
        with:
          appID: ${{ secrets.RELEASE_APP_ID }}
          appPrivateKey: ${{ secrets.RELEASE_APP_PK }}
          files: |
            thunder:bootstrap/build/libs/Thunder.jar
          releaseEnabled: false
          saveMetadata: true
          releaseProject: 'thunder'
          releaseVersion: ${{ steps.get-version.outputs.VERSION }}

      - name: Publish to Downloads API
        if: ${{ success() && github.repository == 'GeyserMC/PackConverter' && github.ref_name == 'master' }}
        uses: GeyserMC/actions/upload-release@master
        with:
          username: ${{ vars.DOWNLOADS_USERNAME }}
          privateKey: ${{ secrets.DOWNLOADS_PRIVATE_KEY }}
          host: ${{ secrets.DOWNLOADS_SERVER_IP }}
          files: |
            bootstrap/build/libs/Thunder.jar
          changelog: ${{ steps.metadata.outputs.body }}

      - name: Notify Discord
        if: ${{ (success() || failure()) && github.repository == 'GeyserMC/PackConverter' }}
        uses: GeyserMC/actions/notify-discord@master
        with:
          discordWebhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          body: ${{ steps.metadata.outputs.body }}
          includeDownloads: ${{ github.ref_name == 'master' }}
